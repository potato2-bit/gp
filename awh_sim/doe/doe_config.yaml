# DoE sampling config (consumed by doe/sample_doe.py)
# Mirrors awh_sim_config.yaml:doe but kept standalone so the DoE table is
# regenerable bit-for-bit from this file + seed alone.
sampler: sobol            # sobol | lhs
seed: 20260626
n_lowfi: 384              # CADET cheap points
n_highfi: 40              # OpenFOAM points (nested subset of low-fi: high-fi ⊂ low-fi)
n_test_highfi: 12         # independent high-fi test set for Gate G3
nested: true              # enforce high-fi ⊂ low-fi for co-kriging pairing
factors:                  # [min, max]
  T_ads_C:    [5, 30]
  RH_ads_pct: [15, 90]
  T_reg_C:    [60, 120]
  u_face_m_s: [0.1, 1.0]
  L_bed_mm:   [30, 150]
  d_p_mm:     [1.0, 4.0]
  t_half_h:   [2.0, 12.0]
out_design: ../data/doe_design.csv   # adds a 'fidelity' column: lowfi|highfi|test
